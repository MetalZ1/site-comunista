<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se Todos Fossem Patrões - Reflexão Comunista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER COM MENU -->
    <header class="header">
        <div class="container-header">
            <div class="logo">
                <h1 id="site-titulo">Se Todos Fossem Patrões</h1>
            </div>
            <nav class="nav" id="menu-nav">
                <!-- Menu carregado dinamicamente pelo JavaScript -->
            </nav>
        </div>
    </header>

    <!-- BANNER PRINCIPAL -->
    <section class="banner">
        <div class="banner-content">
            <h1>Se todos<br>fossem<br>patrões,</h1>
        </div>
    </section>

    <!-- PERGUNTA CENTRAL -->
    <section class="pergunta">
        <h2>Quem trabalharia?</h2>
    </section>

    <!-- CONTEÚDO DINÂMICO -->
    <section class="conteudo">
        <div class="container">
            <article id="conteudo-principal">
                <!-- Conteúdo carregado dinamicamente -->
            </article>
        </div>
    </section>

    <!-- SEÇÃO DE LIVROS (aparece apenas em "Recursos") -->
    <section class="secao-recursos" id="secao-livros" style="display: none;">
        <div class="container">
            <h2>📚 Livros para Download</h2>
            <div class="grid-recursos" id="lista-livros">
                <!-- Livros carregados dinamicamente -->
            </div>
        </div>
    </section>

    <!-- SEÇÃO DE VÍDEOS (aparece apenas em "Vídeos") -->
    <section class="secao-recursos" id="secao-videos" style="display: none;">
        <div class="container">
            <h2>🎬 Vídeos Recomendados</h2>
            <div class="grid-recursos" id="lista-videos">
                <!-- Vídeos carregados dinamicamente -->
            </div>
        </div>
    </section>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <p id="rodape-texto">Frente Aberta - Educação Política e Construção Coletiva</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
